<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shop | FEET TO FIT</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav>

<a href="../index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="contact.html">Contact</a>

</nav>

<!-- SHOP SECTION -->

<div class="container py-5">

<h1 class="text-center mb-5">
GYM SHOP
</h1>

<div class="row">

<!-- PRODUCT 1 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="OIP (5).webp"
class="img-fluid mb-3"
alt="female outfit">

<h3>Gym Outfit For Female</h3>

<p>Ksh 3,500</p>

<button class="btn-yellow"
onclick="addToCart('Gym Outfit For Female')">

Add To Cart

</button>

</div>

</div>

<!-- PRODUCT 2 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="OIP (11).webp"
class="img-fluid mb-3"
alt="male outfit">

<h3>Gym Outfit For Men</h3>

<p>Ksh 1,800</p>

<button class="btn-yellow"
onclick="addToCart('Gym Outfit For Men')">

Add To Cart

</button>

</div>

</div>

<!-- PRODUCT 3 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="enquirenowpopup.webp"
class="img-fluid mb-3"
alt="yoga mat">

<h3>Yoga Mat</h3>

<p>Ksh 2,000</p>

<button class="btn-yellow"
onclick="addToCart('Yoga Mat')">

Add To Cart

</button>

</div>

</div>

</div>

<!-- CART -->

<div class="mt-5">

<h2>Your Cart</h2>

<ul id="cartList"></ul>

<!-- CHECKOUT -->

<div class="text-center mt-4">

<button class="btn-yellow"
onclick="checkout()">

Checkout

</button>

<p id="checkoutMessage"></p>

</div>

</div>

<!-- IP ADDRESS -->

<p id="ipAddress"
class="mt-4 text-center"></p>

</div>

<!-- SCRIPT -->

<script>

const cartList =
document.getElementById("cartList");

/* ADD TO CART */

function addToCart(product){

    const li =
    document.createElement("li");

    li.innerHTML =
    product + " added to cart ✅";

    cartList.appendChild(li);

}

/* CHECKOUT */

function checkout(){

    document.getElementById("checkoutMessage")
    .innerHTML =
    "✅ Checkout Successful! Thank you for shopping.";

    document.getElementById("checkoutMessage")
    .style.color = "#00c853";

    document.getElementById("checkoutMessage")
    .style.fontWeight = "bold";

    document.getElementById("checkoutMessage")
    .style.marginTop = "20px";

}

/* IP ADDRESS */

fetch("https://api.ipify.org?format=json")

.then(response => response.json())

.then(data => {

document.getElementById("ipAddress")
.innerHTML =
"Your IP Address: " + data.ip;

});

</script>

</body>

</html>
