<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shop | FEET TO FIT</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav>

<a href="../index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="contact.html">Contact</a>

<span id="userInfo"></span>

</nav>

<!-- SHOP SECTION -->

<div class="container py-5">

<h1 class="text-center mb-5">
GYM SHOP
</h1>

<div class="row" id="productsContainer">

<!-- PRODUCT 1 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="OIP (5).webp"
class="img-fluid mb-3"
alt="female outfit">

<h3>Gym Outfit For Female</h3>

<p>Ksh 3,500</p>

<button class="btn-yellow"
onclick="addToCart('Gym Outfit For Female', 3500)">

Add To Cart

</button>

</div>

</div>

<!-- PRODUCT 2 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="OIP (11).webp"
class="img-fluid mb-3"
alt="male outfit">

<h3>Gym Outfit For Men</h3>

<p>Ksh 1,800</p>

<button class="btn-yellow"
onclick="addToCart('Gym Outfit For Men', 1800)">

Add To Cart

</button>

</div>

</div>

<!-- PRODUCT 3 -->

<div class="col-md-4 mb-4">

<div class="card-box">

<img src="enquirenowpopup.webp"
class="img-fluid mb-3"
alt="yoga mat">

<h3>Yoga Mat</h3>

<p>Ksh 2,000</p>

<button class="btn-yellow"
onclick="addToCart('Yoga Mat', 2000)">

Add To Cart

</button>

</div>

</div>

</div>

<!-- CART -->

<div class="mt-5">

<h2>Your Cart</h2>

<ul id="cartList"></ul>

<p id="cartTotal" style="font-weight: bold; font-size: 18px;"></p>

<!-- CHECKOUT -->

<div class="text-center mt-4">

<button class="btn-yellow"
onclick="checkout()">

Checkout

</button>

<p id="checkoutMessage"></p>

</div>

</div>

<!-- IP ADDRESS -->

<p id="ipAddress"
class="mt-4 text-center"></p>

</div>

<!-- SCRIPT -->

<script>

const API_URL = 'http://localhost:5000/api';
const cartList = document.getElementById("cartList");
let cart = [];
let userId = localStorage.getItem('userId');

// Load cart from backend
async function loadCart() {
  if (!userId) return;
  
  try {
    const response = await fetch(`${API_URL}/cart/${userId}`);
    cart = await response.json();
    displayCart();
  } catch (error) {
    console.log('Using local cart:', error);
  }
}

// Display cart items
function displayCart() {
  cartList.innerHTML = '';
  let total = 0;
  
  cart.forEach((item, index) => {
    const li = document.createElement("li");
    li.innerHTML = `${item.product} - Ksh ${item.price} <button onclick="removeFromCart(${index})">Remove</button>`;
    cartList.appendChild(li);
    total += item.price;
  });
  
  document.getElementById('cartTotal').innerHTML = `Total: Ksh ${total}`;
}

/* ADD TO CART */

async function addToCart(product, price) {
  if (!userId) {
    userId = 'guest-' + Date.now();
    localStorage.setItem('userId', userId);
  }

  try {
    const response = await fetch(`${API_URL}/cart/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, product, price })
    });

    const data = await response.json();
    cart = data.cart || [...cart, { product, price }];
    displayCart();
  } catch (error) {
    cart.push({ product, price });
    displayCart();
  }
}

/* REMOVE FROM CART */

function removeFromCart(index) {
  cart.splice(index, 1);
  displayCart();
}

/* CHECKOUT */

async function checkout() {
  if (cart.length === 0) {
    alert('Your cart is empty!');
    return;
  }

  try {
    const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
    
    const response = await fetch(`${API_URL}/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId,
        items: cart,
        totalPrice,
        shippingAddress: 'Kenya'
      })
    });

    const data = await response.json();
    
    document.getElementById("checkoutMessage").innerHTML =
      "✅ Checkout Successful! Order ID: " + data.orderId;

    document.getElementById("checkoutMessage").style.color = "#00c853";
    document.getElementById("checkoutMessage").style.fontWeight = "bold";
    document.getElementById("checkoutMessage").style.marginTop = "20px";

    cart = [];
    displayCart();
    
    fetch(`${API_URL}/cart/${userId}`, { method: 'DELETE' });
  } catch (error) {
    console.log('Checkout error:', error);
    alert('Checkout failed. Please try again.');
  }
}

/* IP ADDRESS */

fetch("https://api.ipify.org?format=json")

.then(response => response.json())

.then(data => {

document.getElementById("ipAddress").innerHTML = "Your IP Address: " + data.ip;

});

// Load cart on page load
loadCart();

</script>

</body>

</html>
